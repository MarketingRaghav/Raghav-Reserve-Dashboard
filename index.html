<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>Reserve Cost Dashboard</title>
<style>
/* Layout: one screen on desktop. Header, four KPI tiles, then two rows of three panels. Panels scroll inside themselves. Below 1000px it stacks and the page scrolls. */
:root{
  --bg:#F4F3F2; --surface:#FFFFFF; --ink:#26201F; --ink2:#5B5250; --muted:#80777A; --line:#E3DEDC;
  --paid:#8A2C45; --owed:#A67C1E; --accent:#8A2C45; --over:#A32D2D; --wash:#F9F7F6; --good:#3E8E5E; --tint:#F6EBEE; --alert:#FBEDED;
  --f-ui:'Times New Roman',Times,'Liberation Serif',serif;
  --f-hero:'Times New Roman',Times,'Liberation Serif',serif;
  --row:clamp(22px,3.1vh,28px);
}
:root{--track:color-mix(in srgb,var(--muted) 30%,var(--surface));--edge:color-mix(in srgb,var(--paid) 34%,var(--surface));--shadow:0 1px 2px rgba(70,20,35,.08),0 5px 14px rgba(70,20,35,.09)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161212; --surface:#201A1A; --ink:#F2ECEA; --ink2:#C4B9B6; --muted:#938886; --line:#352D2D;
    --paid:#C0566B; --owed:#B08A35; --accent:#D9798A; --over:#F09595; --wash:#1B1616; --good:#5BB27F; --tint:#2D1F23; --alert:#3A2123; --shadow:0 1px 2px rgba(0,0,0,.4),0 5px 14px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161212; --surface:#201A1A; --ink:#F2ECEA; --ink2:#C4B9B6; --muted:#938886; --line:#352D2D;
  --paid:#C0566B; --owed:#B08A35; --accent:#D9798A; --over:#F09595; --wash:#1B1616; --good:#5BB27F; --tint:#2D1F23; --alert:#3A2123; --shadow:0 1px 2px rgba(0,0,0,.4),0 5px 14px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;line-height:1.4;margin:0;font-variant-numeric:tabular-nums}
.wrap{max-width:1680px;margin:0 auto;padding-inline:16px;padding-block:12px 24px;display:flex;flex-direction:column;gap:10px}
h1,h2{margin:0;font-weight:600}
h1{font-family:var(--f-hero);font-size:22px;line-height:1.1;white-space:nowrap;letter-spacing:.01em}
h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
svg{flex:none}
.top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.id{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto}
.logo{height:58px;width:auto;flex:none;display:block;border-radius:6px;border:1px solid var(--line)}
.sub{margin:2px 0 0;color:var(--ink2);font-size:12px;white-space:nowrap}
.sub2l{margin:1px 0 0;color:var(--muted);font-size:11px;max-width:420px;line-height:1.35}
.sub2l .stale{display:block;color:var(--over);font-weight:600}
.who{font-size:11px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
#gate .card{background:var(--surface);border:1px solid var(--edge);box-shadow:var(--shadow);border-radius:12px;padding:22px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
#gate h2{font-family:var(--f-hero);font-size:22px;text-transform:none;letter-spacing:0;color:var(--ink)}
#gate p{margin:0;color:var(--ink2)}
#gate input{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
#gate .go,#pub .go{font:inherit;font-size:14px;font-weight:600;padding:9px 12px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
#gate .err,#pub .err{color:var(--over);font-size:12px;min-height:16px}
#pub-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
#pub{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);border:1px solid var(--edge);box-shadow:var(--shadow);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
#pub h2{font-size:13px}
#pub table{width:100%;border-collapse:collapse;font-size:12.5px}
#pub td,#pub th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
#pub td:first-child,#pub th:first-child{text-align:left}
#pub .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

#msg.err{color:var(--over)}
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:1 1 auto;justify-content:center}
.filters select,.filters input[type=date]{font:inherit;font-size:12px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 6px;flex:1 1 96px;min-width:0;max-width:150px;width:auto}
.filters input[type=date]{max-width:132px}
.filters .reset{font:inherit;font-size:12px;background:none;border:0;color:var(--accent);cursor:pointer;padding:4px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.seg button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--ink2);padding:4px 9px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:500}
.btn{font:inherit;font-size:12px;font-weight:500;display:inline-block;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:5px 10px;cursor:pointer}
.btn:hover{background:var(--wash)}
.tools .btn{font-size:11px;padding:3px 8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--edge);box-shadow:var(--shadow);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;min-width:0}
.ic{width:38px;height:38px;border-radius:9px;background:var(--tint);color:var(--accent);display:grid;place-items:center;flex:none}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.kb{min-width:0;flex:1}
.kpi .l{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:5px;align-items:center;white-space:nowrap;min-width:0}
.kpi .l .lt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.info{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;border:1px solid var(--muted);font-size:9px;font-style:normal;letter-spacing:0;text-transform:none;cursor:help;color:var(--muted)}
.kpi .v{font-family:var(--f-hero);font-size:26px;line-height:1.1;margin:1px 0;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.kpi .s{font-size:11px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .s a{color:var(--accent);cursor:pointer;text-decoration:underline}
.chip{font-size:10px;line-height:1.25;color:var(--over);background:var(--alert);border-radius:6px;padding:3px 7px;text-align:center;flex:none}
.chip b{display:block;font-size:12px;font-weight:600}
.ring{width:54px;height:54px;flex:none}
.ring text{font-size:12px;font-weight:600;fill:var(--ink);font-family:var(--f-ui)}

/* Panels */
.row{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--edge);box-shadow:var(--shadow);border-radius:10px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;min-height:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex:none;flex-wrap:wrap}
.panel .seg button{padding:3px 9px;font-size:11px}
.legend{display:flex;gap:10px;font-size:11px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.scroll{min-height:0;min-width:0}
.note{margin:6px 0 0;font-size:11px;color:var(--ink2)}
.link{font:inherit;font-size:11px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0}

/* Category bars */
.cathead,.cat{display:grid;grid-template-columns:minmax(64px,1.9fr) 66px minmax(36px,1.1fr) 46px;gap:8px;align-items:center}
.more{font:inherit;font-size:12px;color:var(--accent);background:none;border:0;border-top:1px solid var(--line);padding:9px 0;width:100%;cursor:pointer;text-align:center}
.cathead{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:3px;flex:none}
.cathead span{white-space:nowrap}
.cathead span:nth-child(2),.cathead span:nth-child(4),.cat .a1,.cat .p{text-align:right}
.cat{width:100%;min-height:var(--row);text-align:left;font:inherit;font-size:12px;color:inherit;background:none;border:0;border-top:1px solid var(--line);padding:0;cursor:pointer}
button.cat:hover{background:var(--wash)}
.cat .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
.cat .p{color:var(--ink2);font-size:11px;padding-right:2px}
.cat.tot{cursor:default;font-weight:600;border-top:2px solid var(--line)}
.cat.tot .p{color:var(--ink)}
.track{display:flex;height:10px;min-width:0}
.track i{display:block;height:10px;border-radius:2px 4px 4px 2px}
.track i+i{margin-left:2px}
#cats{display:flex;flex-direction:column}

/* Ageing */
.age{display:flex;gap:8px;min-height:130px;flex:1}
.age>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.age .val{font-size:11px;font-weight:500;white-space:nowrap}
.age .bw{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center}
.age .bar{width:min(34px,70%);border-radius:4px 4px 0 0;min-height:2px}
.age .lab{font-size:10px;color:var(--muted);white-space:nowrap;text-align:center;line-height:1.2}
.age .pc{font-size:11px;font-weight:600}
.alert{display:flex;gap:7px;align-items:center;margin-top:8px;padding:6px 9px;border-radius:7px;background:var(--alert);color:var(--over);font-size:11.5px;flex:none}
.alert svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.b0{background:var(--good)}.b1,.b2{background:var(--owed)}.b3{background:var(--paid)}.b4{background:var(--muted);opacity:.55}
.c0{color:var(--good)}.c1,.c2{color:var(--owed)}.c3{color:var(--paid)}.c4{color:var(--muted)}

/* Monthly */
#mcol{flex:1;min-height:140px;overflow:hidden}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--f-ui);font-size:10px;fill:var(--muted)}
.chart .vl{fill:var(--ink2);font-size:11px}
.foot{display:flex;gap:8px;align-items:center;margin-top:8px;padding:6px 9px;border-radius:7px;background:var(--wash);font-size:11.5px;color:var(--ink2);flex:none;flex-wrap:wrap}
.foot b{color:var(--ink);font-weight:600}

/* Table */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:0 5px;height:var(--row);text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:2px}
th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--surface);z-index:1;cursor:default}
tfoot td{font-weight:600;border-bottom:0;border-top:2px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
td input{font:inherit;font-size:12px;width:62px;height:calc(var(--row) - 6px);text-align:right;color:var(--ink);background:var(--wash);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.over{color:var(--over);font-weight:500}
.lk{font:inherit;font-size:12px;font-weight:500;background:none;border:0;color:inherit;padding:0;cursor:pointer;text-align:left}
.lk:hover{color:var(--accent);text-decoration:underline}
.rm{font:inherit;font-size:10px;background:none;border:0;color:var(--muted);cursor:pointer}
.add{display:flex;gap:6px}
.add input{font:inherit;font-size:12px;color:var(--ink);background:var(--wash);border:1px solid var(--line);border-radius:6px;padding:0 8px;height:24px;min-width:0;width:170px}
.add .btn{padding:0 10px;height:24px}

/* Donut */
.dn{flex:1;min-height:64px;display:flex;justify-content:center;align-items:center}
.dn svg{height:100%;max-height:190px;width:auto;max-width:100%}
.dn text{font-family:var(--f-hero);fill:var(--ink)}
.dn .t2{font-family:var(--f-ui);font-size:10.5px;fill:var(--muted)}
.lg{display:grid;grid-template-columns:auto 1fr auto auto;gap:3px 8px;align-items:center;font-size:12px;margin-top:6px;flex:none}
.lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.lg span:nth-child(4n+3){text-align:right;font-weight:600}
.lg span:nth-child(4n+4){text-align:right;color:var(--ink2);min-width:38px}
.def{margin:6px 0 0;font-size:10.5px;color:var(--muted);flex:none}

#tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:6px;max-width:260px;box-shadow:0 2px 8px rgba(0,0,0,.2)}

@media (min-width:1000px){
  .filters{flex:1 1 0;flex-wrap:nowrap;min-width:0}
  .row3{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1.2fr)}
  .row4{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)}
  .row4.nobud{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:1000px) and (min-height:620px){
  html,body{height:100%;overflow:hidden}
  .wrap{height:100%;padding-block:10px;display:grid;grid-template-rows:auto auto minmax(0,1.1fr) minmax(0,1fr)}
  .row{min-height:0}
  .scroll{flex:1;overflow:auto}
  #cats{flex:1;min-height:0;overflow:auto}
  .tw{flex:1;overflow:auto}
  .row4>.panel:nth-child(2){overflow:auto}
}
@media (max-width:999px){
  .filters{justify-content:flex-start;flex-basis:100%}
  .tools{margin-left:0}
  .age{min-height:170px}
  #mcol{min-height:190px;flex:none}
}
@media (min-width:641px) and (max-width:999px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row3{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .row3>.panel:first-child{grid-column:1/-1}
  .row3>.panel{align-self:stretch}
  :root{--row:24px}
  .dn{min-height:170px}
}
@media (max-width:640px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:9px;flex-wrap:wrap}
  .kpi .ic,.kpi .ring{display:none}
  .kpi .v{font-size:21px}
  .kpi .s{white-space:normal}
  .cathead,.cat{grid-template-columns:minmax(60px,1.6fr) 66px minmax(20px,.5fr) 50px;gap:6px}
  .dn{min-height:180px}
  h1{font-size:19px}
  .sub2l{max-width:240px}
}
#dr[hidden],#dr-bg[hidden]{display:none}
#dr-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;padding:14px 16px;gap:10px;box-shadow:-8px 0 24px rgba(0,0,0,.18)}
#dr>header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
#dr.wide{width:min(1040px,100vw)}
.sz{min-width:900px}
.drbody .wk td,.drbody .wk th{white-space:nowrap}
.drbody .wk td:first-child{white-space:normal;min-width:120px}
.sz td:first-child,.sz th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.sz tr.tot td:first-child{background:var(--surface)}
@media (max-width:640px){.wk .hc{display:none}.wk td,.wk th{padding-left:4px;padding-right:4px;font-size:11.5px}#dr{padding:12px}}
.sz td,.sz th{padding:0 7px}
.sz th{text-transform:none;letter-spacing:0;font-size:11px}
.sz td:first-child{min-width:150px;white-space:normal}
.sz tr.sub td{font-size:11px;color:var(--ink2);height:24px}
.sz tr.tot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0;position:sticky;bottom:0;background:var(--surface)}
.drbody td.z{color:var(--muted)}
#dr h2{font-family:var(--f-hero);font-size:20px;text-transform:none;letter-spacing:0;color:var(--ink)}
#dr-s{margin:2px 0 0;font-size:12px;color:var(--ink2)}
.drbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.drbody{flex:1;min-height:0;overflow:auto}
.drbody td{height:26px;white-space:normal}
.drbody th:first-child,.drbody td:first-child{text-align:left}
.drbody tr.vrow{cursor:pointer}
.drbody tr.vrow:hover td{background:var(--wash)}
.drbody tr.sub td{color:var(--ink2);padding:3px 6px 6px 18px;line-height:1.45;height:auto;border-bottom-color:transparent;font-size:11px}
.drbody .car{display:inline-block;width:12px;color:var(--muted)}

body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--elev) center 8%/cover no-repeat}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 62%,transparent) 0%,color-mix(in srgb,var(--bg) 80%,transparent) 40%,color-mix(in srgb,var(--bg) 92%,transparent) 100%)}
.kpi,.panel{background:color-mix(in srgb,var(--surface) 93%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:box-shadow .2s,transform .2s}
.kpi:hover,.panel:hover{box-shadow:0 2px 4px rgba(70,20,35,.10),0 10px 24px rgba(70,20,35,.14)}
.top{padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--surface) 72%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--edge);box-shadow:var(--shadow);position:relative}
.top::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--paid),var(--owed),transparent)}
#gate{background:linear-gradient(180deg,rgba(24,12,16,.30),rgba(24,12,16,.62)),var(--elev) center 12%/cover no-repeat}
#gate .card{background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-color:color-mix(in srgb,var(--surface) 55%,transparent);box-shadow:0 18px 50px rgba(0,0,0,.35);border-radius:16px;padding:26px}
#gate h2{font-size:26px;letter-spacing:.01em}
#gate h2::after{content:"";display:block;width:44px;height:3px;border-radius:3px;margin-top:8px;background:linear-gradient(90deg,var(--paid),var(--owed))}
#gate input:focus{outline:2px solid var(--owed);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.kpi,.panel{transition:none}}
</style>

function model(rs,ref){
  const m={inv:0,nPay:0,nTds:0,cost:0,paid:0,tds:0,owed:0,old:0,nOwed:0,nOld:0,cat:new Map(),ven:new Map(),age:[0,0,0,0,0],ageN:[0,0,0,0,0],pay:new Map(),undated:0};
  rs.forEach(r=>{
    const c=r.p+r.x,o=r.due-r.x-r.p,ck=r.c||'Uncategorised';
    m.cost+=c;m.paid+=r.p;m.tds+=r.x;m.owed+=o;m.inv+=r.i||0;m.nPay+=r.y.length;if(r.x>0)m.nTds++;
    const a=m.cat.get(ck)||{cost:0,owed:0,old:0};a.cost+=c;a.owed+=o;m.cat.set(ck,a);
    const vk=r.v.toLowerCase(),b=m.ven.get(vk)||{name:r.v,cost:0,owed:0};b.cost+=c;b.owed+=o;m.ven.set(vk,b);
    if(o>0.5){m.nOwed++;
      if(r.d){const g=dayDiff(ref,r.d),i=g<=30?0:g<=60?1:g<=90?2:3;if(g>30){m.old+=o;m.nOld++;a.old+=o}m.age[i]+=o;m.ageN[i]++}
      else{m.age[4]+=o;m.ageN[4]++}}
    let ent=0;r.y.forEach(([d,x])=>{ent+=x;if(d){const k=d.slice(0,7);m.pay.set(k,(m.pay.get(k)||0)+x)}else m.undated+=x});
    if(Math.abs(r.p-ent)>0.5)m.undated+=r.p-ent;
  });
  return m;
}
/* As-of view: drop invoices dated after the till date and payments made after it. TDS has no date in the tracker, so it follows its invoice. */
function asOf(){
  if(!till||till>=todayISO)return rows;
  return rows.filter(r=>!r.d||r.d<=till).map(r=>{const cut=r.y.reduce((s,[d,a])=>s+(d&&d>till?a:0),0);return Object.assign({},r,{y:r.y.filter(([d])=>!d||d<=till),p:r.p-cut})});
}

function buildFilters(){

  const vens=[...m.ven.entries()].sort((a,b)=>b[1].cost-a[1].cost).map(([k,v])=>[k,v.name]);
  const typs=[...new Set(rows.map(r=>r.t||'Not stated'))].sort().map(t=>[t,t]);
  if(!cats.some(c=>c[0]===flt.cat))flt.cat='';if(!vens.some(c=>c[0]===flt.ven))flt.ven='';if(!typs.some(c=>c[0]===flt.typ))flt.typ='';

const SHOW_BUDGET=false;
let B={b:{},x:[]};
try{const j=JSON.parse(store('reserve-ctc-v1')||'null');if(j&&j.b)B={b:j.b,x:j.x||[]}}catch(e){}
const saveB=()=>store(null,['reserve-ctc-v1',JSON.stringify(B)]);
const hasB=n=>B.b[n]!==undefined&&!isNaN(B.b[n]);
function budgetOf(m){
  if(flt.ven||flt.typ)return {off:true};
  let tot=0,cost=0,owed=0,n=0,miss=0,missCost=0;
  m.cat.forEach((v,k)=>{if(hasB(k)){n++;tot+=B.b[k]*1e5;cost+=v.cost;owed+=v.owed}else if(v.cost>0||v.owed>0.5){miss++;missCost+=v.cost}});
  if(!flt.cat)B.x.forEach(k=>{if(!m.cat.has(k)&&hasB(k)){n++;tot+=B.b[k]*1e5}});
  return {n,tot,cost,owed,miss,missCost,rem:tot-cost-owed,tocomplete:tot-cost};
}

function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));for(const k of [1,2,2.5,5,10])if(v<=k*e)return k*e;return 10*e}
function axisLabel(v){return v>=1e7?(v/1e7).toFixed(v%1e7?1:0)+' Cr':(v/1e5).toFixed(v%1e5?1:0)+' L'}
function monthsWindow(m){
  const keys=[...m.pay.keys()].sort();if(!keys.length)return [];
  let [y,mo]=keys[keys.length-1].split('-').map(Number);const out=[];
  for(let i=0;i<12;i++){out.unshift(y+'-'+pad(mo));mo--;if(!mo){mo=12;y--}}
  return out;
}
function renderMonthly(m){
  const win=monthsWindow(m),box=$('#mcol'),foot=$('#mfoot');
  if(!win.length){box.innerHTML='<p class="note">No dated payments for this selection.</p>';foot.innerHTML='';return}
  const sorted=[...m.pay.keys()].sort(),vals=win.map(k=>m.pay.get(k)||0);
  const cum=win.map(k=>sorted.filter(s=>s<=k).reduce((s,q)=>s+m.pay.get(q),0));
  const W=Math.max(240,box.clientWidth||300),H=Math.max(120,box.clientHeight||160),Lm=40,Rm=8,Tm=18,Bm=20,pw=W-Lm-Rm,ph=H-Tm-Bm,step=pw/12,bw=Math.min(22,step*.6);
  const series=monMode==='mon'?vals:cum,mx=niceMax(Math.max(...series,1)),last=vals.length-1,skip=step<46?2:1;
  const pk=vals.indexOf(Math.max(...vals));
  let s='<svg viewBox="0 0 '+W+' '+H+'" height="'+H+'" role="img" aria-label="'+(monMode==='mon'?'Cash paid per month':'Running total of cash paid')+', last 12 months">';
  [0,.5,1].forEach(f=>{const y=Tm+ph-ph*f;s+=(f?'':'<line x1="'+Lm+'" x2="'+(W-Rm)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/>')+'<text x="'+(Lm-5)+'" y="'+(y+3)+'" text-anchor="end">'+(f?axisLabel(mx*f):'0')+'</text>'});
  if(monMode==='mon'){
    vals.forEach((v,i)=>{
      const h=v/mx*ph,x=Lm+step*i+(step-bw)/2,y=Tm+ph-h;
      if(h>0.5)s+='<path d="M'+x+' '+(Tm+ph)+'V'+(y+4)+'Q'+x+' '+y+' '+(x+4)+' '+y+'H'+(x+bw-4)+'Q'+(x+bw)+' '+y+' '+(x+bw)+' '+(y+4)+'V'+(Tm+ph)+'Z" fill="var(--paid)"/>';
      if(h>0.5&&(i===pk||i===last)){const py=i>0?Tm+ph-vals[i-1]/mx*ph:y,ly=(i===last&&i!==pk)?Math.min(y,py)-4:y-4;s+='<text class="vl" x="'+(i===last&&i!==pk?x+bw:x+bw/2)+'" y="'+ly+'" text-anchor="'+(i===last&&i!==pk?'end':'middle')+'">'+cr(v)+'</text>'}
    });
  }else{
    const pts=cum.map((c,i)=>[Lm+step*i+step/2,Tm+ph-c/mx*ph]);
    s+='<path d="M'+pts[0][0]+' '+(Tm+ph)+pts.map(p=>'L'+p[0]+' '+p[1]).join('')+'L'+pts[pts.length-1][0]+' '+(Tm+ph)+'Z" fill="var(--paid)" opacity=".1"/>';

    const e=pts[pts.length-1];s+='<circle cx="'+e[0]+'" cy="'+e[1]+'" r="4.5" fill="var(--paid)" stroke="var(--surface)" stroke-width="2"/><text class="vl" x="'+(e[0]-8)+'" y="'+(e[1]-7)+'" text-anchor="end">'+cr(cum[cum.length-1])+'</text>';

    s+='<rect x="'+x+'" y="'+Tm+'" width="'+step+'" height="'+(ph+Bm)+'" fill="transparent" tabindex="0" data-ym="'+k+'" style="cursor:pointer" role="button" aria-label="Week-wise breakup for '+ymLabel(k)+'" data-tip="'+esc(ymLabel(k)+'<br>Paid '+cr(vals[i])+'<br>Running total '+cr(cum[i])+'<br>Click for week-wise breakup')+'"/>';

  const totalPaid=sorted.reduce((s,q)=>s+m.pay.get(q),0),pkShare=totalPaid>0?vals[pk]/totalPaid:0;
  foot.innerHTML='<span><b>Running total paid '+cr(cum[cum.length-1])+'</b></span><span>Peak '+ymLabel(win[pk])+' at '+cr(vals[pk])+' ('+pc(pkShare)+' of dated payments)</span>'+(m.undated>0?'<span>'+cr(m.undated)+' paid has no date, not shown</span>':'')+'<span class="hint">Click a month for the week-wise breakup</span>';

function renderTable(m){
  /* Budget columns are hidden for now. Set SHOW_BUDGET=true and unhide #addform and #donutpanel to bring them back. */
  if(!SHOW_BUDGET){
    const names=[...m.cat.entries()].sort((a,b)=>b[1].cost-a[1].cost).map(e=>e[0]);
    let h='<thead><tr><th>Category</th><th title="Paid plus TDS">Paid + TDS</th><th>% of total</th><th title="Billed, not yet paid">Outstanding</th></tr></thead><tbody>';
    names.forEach(n=>{const v=m.cat.get(n);h+='<tr data-n="'+esc(n)+'"><td><button type="button" class="lk" data-k="'+esc(n)+'">'+esc(n)+'</button></td><td>'+cr(v.cost)+'</td><td>'+(m.cost>0?pcs(v.cost/m.cost):'–')+'</td><td>'+(v.owed>0.5?cr(v.owed):'–')+'</td></tr>'});
    h+='</tbody><tfoot><tr><td>Total</td><td>'+cr(m.cost)+'</td><td>100%</td><td>'+cr(m.owed)+'</td></tr></tfoot>';
    $('#ctc').innerHTML=h;
    document.querySelectorAll('#ctc .lk').forEach(b=>b.addEventListener('click',()=>openDr(b.dataset.k)));
    return;

const norm=s=>String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase();
function toISO(v){const r=toISO0(v);return r&&+r.slice(0,4)<2020?'':r}
function toISO0(v){
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+43200000);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
  if(typeof v==='string'){const q=v.match(/^\s*(\d{1,2})[-./](\d{1,2})[-./](\d{4})\s*$/);if(q)return q[3]+'-'+pad(+q[2])+'-'+pad(+q[1])}

}

/* Spelling fixes found in the VPay tracker */
const VALIAS={'sashikant kulkarni huf':'SHASHIKANT KULKARNI HUF','adt industries':'ADT INDUSTRIES PRIVATE LIMITED','trambakeshwar trade pvt ltd':'TRAMBAKESHWAR TRADE PRIVATE LIMITED'};
const fixVen=v=>VALIAS[v.toLowerCase()]||v;
const CALIAS={'rock anxhoring':'Rock Anchoring','rock anchroing':'Rock Anchoring','civil contractor - sub structure':'Civil Contractor - Substructure'};
function fixCat(c){c=String(c==null?'':c).replace(/\s+/g,' ').trim();if(c===''||c==='0')return '';const k=c.toLowerCase();if(CALIAS[k])return CALIAS[k];if(c===c.toUpperCase()&&c.length>4)c=c.toLowerCase().replace(/\b[a-z]/g,x=>x.toUpperCase());return c.replace(/^./,ch=>ch.toUpperCase())}
function parseBook(wb){
  /* VPay: read the RESERVE sheet and the Mivan sheet only. Other sheets in the file belong to other projects. */
  const want=n=>norm(n)==='reserve'||norm(n).indexOf('mivan')>=0;
  const names=wb.SheetNames.filter(want);
  const out=[],used=[];
  names.forEach(sn=>{
    const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
    const hi=a.findIndex((r,i)=>i<60&&r.some(c=>norm(c)==='company name'));
    if(hi<0)return;
    const H={};a[hi].forEach((c,i)=>{if(c!=null&&H[norm(c)]===undefined)H[norm(c)]=i});
    if(H['amount due (manual entry)']===undefined||H['amount paid 1']===undefined)return;
    let n=0;
    a.slice(hi+1).forEach(r=>{
      const g=k=>H[k]===undefined?null:r[H[k]],v=g('company name');
      if(v==null||!String(v).trim())return;
      if(['x','0'].indexOf(norm(v))>=0&&!nm(g('invoice amount')))return;
      const y=[];['1','2','3','4'].forEach(i=>{const x=nm(g('amount paid '+i));if(x)y.push([toISO(g('payment date '+i)),x])});
      const pr=g('amount paid');
      out.push({v:fixVen(String(v).replace(/\s+/g,' ').trim()),c:fixCat(H['sub category']!==undefined?g('sub category'):g('category')),t:String(g('invoice type')||'').trim(),n:String(g('invoice number')==null?'':g('invoice number')).trim(),d:toISO(g('invoice date')),i:nm(g('invoice amount')),due:nm(g('amount due (manual entry)')),p:pr!=null&&pr!==''?nm(pr):y.reduce((s,q)=>s+q[1],0),x:nm(g('tds paid')),y});n++;
    });
    if(n)used.push(sn);
  });
  return out.length?{rows:out,sheet:used.join(' + ')}:null;
}
function parseRft(wb){
  for(const sn of wb.SheetNames){
    const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
    const hi=a.findIndex((r,i)=>i<15&&r.some(c=>norm(c)==='32mm')&&r.some(c=>norm(c)==='particulars'));
    if(hi<0)continue;
    const H={};a[hi].forEach((c,i)=>{if(c!=null)H[norm(c)]=i});
    const keys=['32mm','25mm','20mm','16mm','12mm','10mm','8mm','binding wire'],out=[];
    a.slice(hi+1).forEach(r=>{
      const v=r[H['particulars']];if(v==null||!String(v).trim())return;
      if(H['sr no']!==undefined&&typeof r[H['sr no']]!=='number')return;
      out.push({v:fixVen(String(v).replace(/\s+/g,' ').trim()),b:r[H['bill no']]==null?'':String(r[H['bill no']]),dt:H['date']===undefined?'':toISO(r[H['date']]),w:keys.map(k=>nm(r[H[k]])),t:nm(r[H['total weight']]),a:nm(r[H['amount']])});
    });
    if(out.length)return out;
  }
  return null;
}
function say(t,err){const el=$('#msg');el.textContent=t;el.className=err?'err':''}

/* ---------- Supabase (plain REST, no library) ---------- */
let SES=null,ME='',CAN_UP=false,LATEST=0,STAGED=null,POLL=null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const localISO=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
async function authCall(grant,body){
  const r=await fetch(CFG.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||j.msg||j.message||('Sign-in failed ('+r.status+')'));
  SES={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,email:(j.user&&j.user.email)||ME};lsSet('reserve-ses',JSON.stringify({r:SES.refresh,e:SES.email}));return SES;
}
async function token(){if(!SES)throw new Error('Signed out');if(Date.now()>SES.exp-60000)await authCall('refresh_token',{refresh_token:SES.refresh});return SES.access}
async function rest(path,opt){
  opt=opt||{};const t=await token();
  const r=await fetch(CFG.url+'/rest/v1/'+path,{method:opt.method||'GET',headers:Object.assign({apikey:CFG.key,Authorization:'Bearer '+t,'Content-Type':'application/json'},opt.headers||{}),body:opt.body?JSON.stringify(opt.body):undefined});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error(m||('Request failed ('+r.status+')'))}
  return r.status===204?null:r.json().catch(()=>null);
}
function gate(msg,err,form){$('#gate').hidden=false;$('#app').hidden=true;$('#gmsg').textContent=msg;$('#gerr').textContent=err||'';$('#loginf').querySelectorAll('input,#gobtn').forEach(x=>x.hidden=form===false)}
async function enter(){
  const acc=await rest('allowed_users?select=email,can_upload');
  if(!acc||!acc.length){gate('This email is not on the access list. Ask the dashboard owner to add it.','',false);return false}
  CAN_UP=!!acc[0].can_upload;$('#who').textContent=ME;$('#uplbl').hidden=!CAN_UP;
  await loadLatest(true);$('#gate').hidden=true;$('#app').hidden=false;render();
  clearInterval(POLL);POLL=setInterval(checkNew,300000);return true;
}
const COLS='id,uploaded_at,uploaded_by,source_name,last_invoice,last_payment,n_rows,data,rft';
async function loadLatest(first){
  const q=await rest('snapshots?select='+COLS+'&order=uploaded_at.desc&limit=1');
  if(!q||!q.length){rows=[];RFT=[];META=null;LATEST=0;buildFilters();if(!first)render();return}
  const s=q[0];rows=s.data||[];RFT=s.rft||[];LATEST=s.id;META={up:s.uploaded_at,by:s.uploaded_by,src:s.source_name,li:s.last_invoice,lp:s.last_payment};
  todayISO=localISO(s.uploaded_at);till='';$('#till').max=todayISO;$('#till').value=todayISO;buildFilters();if(!first)render();
}
async function checkNew(){if(document.hidden||!SES)return;try{const q=await rest('snapshots?select=id&order=uploaded_at.desc&limit=1');if(q&&q.length&&q[0].id!==LATEST){await loadLatest(false);say('Updated to the newest upload.')}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkNew()});
function headText(rs){
  const el=$('#src'),st=$('#stale');
  if(!META){el.textContent='No tracker has been uploaded yet.';st.textContent='';return}
  const days=Math.floor((Date.now()-Date.parse(META.up))/864e5);
  el.innerHTML='VPay entries to <b>'+(META.li?fdateL(META.li):'–')+'</b> · last payment <b>'+(META.lp?fdateL(META.lp):'–')+'</b><br>Uploaded '+fdateL(localISO(META.up))+' · '+rs.length+' of '+rows.length+' invoices'+(till?' · viewing as of '+fdateL(till):'');
  st.textContent=days>7?'Data is '+days+' days old. Last upload '+fdateL(localISO(META.up))+'.':'';
}
$('#loginf').addEventListener('submit',async e=>{
  e.preventDefault();ME=$('#em').value.trim();$('#gerr').textContent='';$('#gobtn').disabled=true;
  try{await authCall('password',{email:ME,password:$('#pw').value});ME=SES.email||ME;$('#pw').value='';await enter()}
  catch(err){SES=null;$('#gerr').textContent=/invalid/i.test(err.message)?'Wrong email or password.':err.message}
  $('#gobtn').disabled=false;
});
$('#signout').addEventListener('click',()=>{lsSet('reserve-ses',null);SES=null;location.reload()});

/* ---------- Upload: read, preview, confirm, publish ---------- */
function say(t,err){const el=$('#msg');el.textContent=t?' '+t:'';el.className=err?'err':''}
function totals(rs){const m=model(rs,todayISO);return {n:rs.length,inv:m.inv,paid:m.paid,tds:m.tds,owed:m.owed}}
function lastDates(rs){let li='',lp='';rs.forEach(r=>{if(r.d&&r.d>li)li=r.d;r.y.forEach(([d])=>{if(d&&d>lp)lp=d})});return {li,lp}}
function closePub(){$('#pub').hidden=true;$('#pub-bg').hidden=true;STAGED=null}
function openPub(){
  const S=STAGED,o=totals(rows),n=totals(S.rows),ld=lastDates(S.rows);
  const row=(l,a,b,f)=>'<tr><td>'+l+'</td><td>'+(META?f(a):'–')+'</td><td><b>'+f(b)+'</b></td></tr>';
  $('#pub').innerHTML='<h2 id="pub-t">PUBLISH THIS UPLOAD TO EVERYONE?</h2><p style="margin:0;color:var(--ink2)">'+esc(S.name)+'. Everyone with access will see these numbers as soon as you publish. The previous upload is kept as history.</p>'
   +'<table><thead><tr><th></th><th>Current</th><th>New</th></tr></thead><tbody>'
   +row('Invoices',o.n,n.n,x=>x)+row('Total invoiced',o.inv,n.inv,cr)+row('Total paid',o.paid,n.paid,cr)+row('TDS paid',o.tds,n.tds,cr)+row('Outstanding',o.owed,n.owed,cr)
   +'<tr><td>Last invoice</td><td>'+(META&&META.li?fdateL(META.li):'–')+'</td><td><b>'+(ld.li?fdateL(ld.li):'–')+'</b></td></tr><tr><td>Last payment</td><td>'+(META&&META.lp?fdateL(META.lp):'–')+'</td><td><b>'+(ld.lp?fdateL(ld.lp):'–')+'</b></td></tr>'
   +'<tr><td>Steel bills</td><td>'+(META?RFT.length:'–')+'</td><td><b>'+S.rft.length+'</b></td></tr></tbody></table>'
   +(S.keptRft?'<p style="margin:0;color:var(--ink2);font-size:12px">The Steel Delivery Table sheet was not found in this file, so the previous steel data is kept.</p>':'')
   +'<div class="err" id="perr" role="alert"></div><div class="row"><button type="button" class="btn" id="pcancel">Cancel</button><button type="button" class="go" id="pgo">Publish to everyone</button></div>';
  $('#pub').hidden=false;$('#pub-bg').hidden=false;
  $('#pcancel').addEventListener('click',closePub);
  $('#pgo').addEventListener('click',async()=>{
    const b=$('#pgo');b.disabled=true;b.textContent='Publishing...';
    try{
      await rest('snapshots',{method:'POST',headers:{Prefer:'return=minimal'},body:{uploaded_by:ME,source_name:S.name,last_invoice:ld.li||null,last_payment:ld.lp||null,n_rows:S.rows.length,data:S.rows,rft:S.rft}});
      closePub();await loadLatest(false);say('Published. Everyone now sees this upload.');
    }catch(err){b.disabled=false;b.textContent='Publish to everyone';$('#perr').textContent='Could not publish: '+err.message}
  });
}
$('#pub-bg').addEventListener('click',closePub);
$('#file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  if(!CAN_UP){say('Your account can view only.',true);e.target.value='';return}
  if(typeof XLSX==='undefined'){say('The spreadsheet reader did not load. Check your connection and try again.',true);e.target.value='';return}
  const fr=new FileReader();
  fr.onload=()=>{try{
    const wb=XLSX.read(new Uint8Array(fr.result),{type:'array',cellDates:true});
    const res=parseBook(wb);
    if(!res){say('Could not find the RESERVE sheet with its header row. Pick the VPay tracker.',true);return}
    const rf=parseRft(wb);
    STAGED={rows:res.rows,rft:rf||RFT,keptRft:!rf&&RFT.length>0,name:f.name};say('',false);openPub();
  }catch(err){say('Could not read that file: '+err.message,true)}e.target.value=''};
  fr.readAsArrayBuffer(f);
});

async function boot(){
  gate('Sign in to see the cost tracker.');
  const sv=lsGet('reserve-ses');if(!sv)return;
  try{const j=JSON.parse(sv);ME=j.e||'';await authCall('refresh_token',{refresh_token:j.r});ME=SES.email||ME;await enter()}
  catch(err){SES=null;lsSet('reserve-ses',null);gate('Sign in to see the cost tracker.')}
}
boot();
if(window.ResizeObserver){let rz;new ResizeObserver(()=>{clearTimeout(rz);rz=setTimeout(()=>{if(M)renderMonthly(M)},100)}).observe($('#mcol'))}
else addEventListener('resize',()=>{if(M)renderMonthly(M)});
</script>
